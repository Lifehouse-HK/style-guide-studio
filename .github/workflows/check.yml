name: Headless checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.12.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx tsx tools/benchmark.ts
      - run: npx tsx tools/render-specimens.ts
      - run: .venv/bin/python tools/qualify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-pdf-check-${{ github.sha }}
          path: |
            work/qualification/final-*.pdf
            work/qualification/final-report.json
          retention-days: 1
