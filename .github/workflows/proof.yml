name: Explicit document proof
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Tracked build JSON path at the selected Git revision
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.12.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock
      - name: Verify explicitly submitted configuration and build proof
        env:
          CONFIGURATION: ${{ inputs.configuration }}
        run: node --import tsx tools/proof.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: document-proof-${{ github.sha }}
          path: work/proof-output
          retention-days: 1
